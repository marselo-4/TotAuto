<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Showroom preview</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0b0d; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
  #c { display: block; width: 100%; height: 100%; }
  #ui { position: fixed; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; max-width: 320px; }
  .box { background: rgba(20,20,24,.85); border: 1px solid #333; border-radius: 8px; padding: 10px 12px; backdrop-filter: blur(6px); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  button { background: #222; color: #eee; border: 1px solid #444; border-radius: 6px; padding: 5px 9px; cursor: pointer; font: inherit; }
  button.on { background: #2f6fed; border-color: #2f6fed; }
  label { display: inline-flex; gap: 6px; align-items: center; margin-right: 10px; }
  #stats { font-family: ui-monospace, monospace; white-space: pre; font-size: 12px; color: #9ad; }
  h1 { font-size: 14px; margin: 0 0 4px; }
  small { color: #888; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="box">
    <h1>Tot Auto · escaneo del local</h1>
    <small>Orbita con el ratón · rueda = zoom · botón derecho = desplazar</small>
    <div class="row" id="models"></div>
    <div class="row">
      <label><input type="checkbox" id="pa" checked /> planta alta</label>
      <label><input type="checkbox" id="styl" /> estilizado (oscuro)</label>
      <label><input type="checkbox" id="wire" /> wireframe</label>
      <label><input type="checkbox" id="cut" /> sección (corta techo a Y=<input id="cuty" type="number" value="0.6" step="0.1" style="width:4em" />)</label>
    </div>
    <div class="row" id="views"></div>
  </div>
  <div class="box" id="stats">cargando…</div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';

const MODELS = ['showroom.glb', 'showroom-hq.glb', 'showroom-mesh.glb'];
// Vistas: [posición cámara, objetivo]. Y=0 ≈ altura de ojos en planta baja (suelo a -1.55).
const VIEWS = {
  'sala principal': [[-6.3, 0.1, 2.0], [2.0, -0.5, -2.5]],
  'sala principal 2': [[0.8, 0.1, 4.5], [-5.0, -0.4, -3.5]],
  'sala trasera':   [[3.0, 0.1, 4.8], [5.5, -0.4, -4.5]],
  'escalera':       [[-2.0, 0.1, 1.5], [2.2, -0.3, -3.0]],
  'fachada':        [[-14, 1.5, 7.0], [-6.5, -0.3, 0.0]],
  'planta alta':    [[-6.5, 2.9, 4.5], [2.0, 2.3, -3.0]],
  'planta (cenital)': [[0.0, 22, 0.2], [0.0, 0, 0.0]],
  'exterior':       [[-14, 6, 14], [0, 0.5, 0]],
};

const params = new URLSearchParams(location.search);
let current = params.get('m') || MODELS[0];
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.localClippingEnabled = false;
const cutPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0.6);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0d);
const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xcfd8e8, 0x222226, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.0); key.position.set(5, 10, 3); scene.add(key);
const fill = new THREE.PointLight(0xffd9a8, 20, 30); fill.position.set(-3, 0.6, 0); scene.add(fill);
const fill2 = new THREE.PointLight(0xa8c8ff, 20, 30); fill2.position.set(4.5, 0.6, 0); scene.add(fill2);

const draco = new DRACOLoader().setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.7/');
const ktx2 = new KTX2Loader().setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/basis/').detectSupport(renderer);
const loader = new GLTFLoader().setDRACOLoader(draco).setKTX2Loader(ktx2);

let model = null, origMats = new Map();
const darkMat = new THREE.MeshStandardMaterial({ color: 0x17171a, roughness: 0.85, metalness: 0.05, flatShading: true, side: THREE.DoubleSide });
const stats = document.getElementById('stats');

async function load(name) {
  current = name;
  document.querySelectorAll('#models button').forEach((b) => b.classList.toggle('on', b.textContent === name));
  if (model) { scene.remove(model); model = null; }
  stats.textContent = 'cargando ' + name + '…';
  const t0 = performance.now();
  const buf = await (await fetch('../' + name)).arrayBuffer();
  const bytes = buf.byteLength;
  const gltf = await new Promise((res, rej) => loader.parse(buf, '../', res, rej));
  const dt = performance.now() - t0;
  model = gltf.scene; scene.add(model);
  let tris = 0, meshes = 0, tex = new Set();
  origMats.clear();
  model.traverse((o) => {
    if (!o.isMesh) return;
    meshes++;
    const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
    origMats.set(o, o.material);
    if (o.material.map) tex.add(o.material.map);
    o.material.side = THREE.DoubleSide;
  });
  const texInfo = [...tex].map((t) => (t.image?.width || t.source?.data?.width || '?') + 'px').join(', ') || 'sin texturas';
  const b = new THREE.Box3().setFromObject(model); const s = b.getSize(new THREE.Vector3());
  stats.textContent = `${name}\n${(bytes/1e6).toFixed(2)} MB · ${Math.round(tris).toLocaleString('es')} tris · ${meshes} mallas\ntexturas: ${tex.size} (${texInfo})\ncaja: ${s.x.toFixed(2)} × ${s.y.toFixed(2)} × ${s.z.toFixed(2)} m\ncarga+parse: ${(dt/1000).toFixed(2)} s`;
  applyToggles();
  history.replaceState(null, '', '?m=' + name + (params.get('v') ? '&v=' + params.get('v') : ''));
}
function applyToggles() {
  if (!model) return;
  const showPA = document.getElementById('pa').checked;
  const styl = document.getElementById('styl').checked;
  const wire = document.getElementById('wire').checked;
  const cut = document.getElementById('cut').checked;
  cutPlane.constant = parseFloat(document.getElementById('cuty').value) || 0.6;
  renderer.clippingPlanes = cut ? [cutPlane] : [];
  model.traverse((o) => {
    if (o.name === 'planta_alta') o.visible = showPA;
    if (!o.isMesh) return;
    o.material = styl ? darkMat : origMats.get(o);
    o.material.wireframe = wire;
  });
}
function setView(name) {
  const [p, t] = VIEWS[name];
  camera.position.set(...p); controls.target.set(...t); controls.update();
  history.replaceState(null, '', '?m=' + current + '&v=' + encodeURIComponent(name));
}
for (const m of MODELS) { const b = document.createElement('button'); b.textContent = m; b.onclick = () => load(m); document.getElementById('models').append(b); }
for (const v of Object.keys(VIEWS)) { const b = document.createElement('button'); b.textContent = v; b.onclick = () => setView(v); document.getElementById('views').append(b); }
['pa', 'styl', 'wire', 'cut', 'cuty'].forEach((id) => document.getElementById(id).onchange = applyToggles);
if (params.get('styl') === '1') document.getElementById('styl').checked = true;
if (params.get('pa') === '0') document.getElementById('pa').checked = false;
if (params.get('cut')) { document.getElementById('cut').checked = true; document.getElementById('cuty').value = params.get('cut'); }

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
setView(params.get('v') && VIEWS[params.get('v')] ? params.get('v') : 'sala principal');
load(current);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
window.__preview = { scene, camera, controls, setView, load, THREE };
// Captura a resolución del canvas y la envía al receptor local (solo para el spike).
window.__shot = (name) => new Promise((res) => { renderer.render(scene, camera); canvas.toBlob((b) => fetch('http://localhost:8788/' + name, { method: 'POST', body: b }).then(() => res(name)).catch(() => res('no receiver')), 'image/jpeg', 0.85); });
</script>
</body>
</html>
